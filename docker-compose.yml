services:

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── One-shot migration runner ────────────────────────────────────────────────
  # Runs alembic upgrade head before any API or worker starts.
  # `restart: no` ensures it exits cleanly after migrations complete.
  # All other services depend on it via `service_completed_successfully`.
  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:Target123@host.docker.internal:5433/cora
    restart: "no"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Containers reach Redis and Postgres by host name, not localhost
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://postgres:Target123@host.docker.internal:5433/cora
      # API handles async concurrent requests — allow more connections
      - POSTGRES_POOL_SIZE=10
      - POSTGRES_MAX_OVERFLOW=5
    volumes:
      # Mount source for --reload to pick up code changes without rebuilding
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Worker: default queue ───────────────────────────────────────────────────
  # Handles: process_call_event, process_voicemail_tier, update_lead_state,
  #          run_nurture_scheduler, send_sms, send_email, collect_metrics.
  # Owns the Postgres scheduler loop and startup tasks (nurture + metrics).
  # Only this role runs the scheduler loop — avoids duplicate job enqueues.
  # Run 3 replicas: docker compose up --scale worker-default=3
  worker-default:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      - WORKER_ROLE=default
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://postgres:Target123@host.docker.internal:5433/cora
      # Each worker process handles one job at a time; 2 connections is sufficient
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_MAX_OVERFLOW=2
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Worker: ai queue ────────────────────────────────────────────────────────
  # Handles: classify_call_event (3 sequential OpenAI calls per job).
  # Isolated so slow OpenAI latency never blocks voicemail tier scheduling.
  # Run 3 replicas: docker compose up --scale worker-ai=3
  worker-ai:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      - WORKER_ROLE=ai
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://postgres:Target123@host.docker.internal:5433/cora
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_MAX_OVERFLOW=2
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Worker: callbacks queue ──────────────────────────────────────────────────
  # Handles: create_crm_task, send_student_summary, launch_outbound_call.
  # GHL and Synthflow API calls. 2 replicas matches practical GHL rate limits.
  # Run 2 replicas: docker compose up --scale worker-callbacks=2
  worker-callbacks:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      - WORKER_ROLE=callbacks
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://postgres:Target123@host.docker.internal:5433/cora
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_MAX_OVERFLOW=2
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Worker: retries queue ────────────────────────────────────────────────────
  # Handles failed job retries in isolation — retry storms never crowd out
  # live traffic on the default or callbacks queues.
  worker-retries:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      - WORKER_ROLE=retries
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://postgres:Target123@host.docker.internal:5433/cora
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_MAX_OVERFLOW=2
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

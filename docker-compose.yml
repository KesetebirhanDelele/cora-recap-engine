services:

  # ── Postgres ─────────────────────────────────────────────────────────────────
  # Persistent storage. Named volume survives container restarts and upgrades.
  # Credentials come from .env via compose variable substitution — never hardcoded.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:-cora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DATABASE:-cora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # Ephemeral queue broker. No persistence needed — job state lives in Postgres.
  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer connection pooler ───────────────────────────────────────────────
  # Sits between app services and Postgres. Transaction mode recycles a Postgres
  # connection after each transaction commit — all 6+ app services share 20 actual
  # Postgres connections regardless of pool_size settings on each service.
  # Listens on :5432 internally. App services use pgbouncer:5432 in DATABASE_URL.
  # migrate and adminer connect directly to postgres:5432 (bypass pooler).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USERNAME:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DATABASE:-cora}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migration runner ──────────────────────────────────────────────────────────
  # One-shot: runs alembic upgrade head then exits cleanly.
  # Connects directly to postgres:5432 — bypasses PgBouncer for DDL safety.
  # All services that touch the DB depend on this completing successfully.
  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-cora}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Webhook + operator API (port 8000) ───────────────────────────────────────
  # Publicly accessible: POST /v1/webhooks/calls must be reachable from Synthflow.
  # --workers 2 matches a 2-vCPU Hetzner CX22. Adjust for larger VMs.
  # No --reload in production. Source code is baked into the image.
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DATABASE:-cora}
      REDIS_HOST: redis
      POSTGRES_POOL_SIZE: "10"
      POSTGRES_MAX_OVERFLOW: "5"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard API (port 8001) ─────────────────────────────────────────────────
  # Read-heavy + operator actions. Isolated from webhook ingestion on port 8000.
  # CORS origin is controlled by ALLOW_ORIGINS in .env.
  dashboard-api:
    build: .
    command: uvicorn app.api.dashboard_main:app --host 0.0.0.0 --port 8001 --workers 2
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DATABASE:-cora}
      REDIS_HOST: redis
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (port 3000) ──────────────────────────────────────────────────────
  # Next.js production build. DASHBOARD_API_URL and WS_URL baked in at build time
  # via next.config.js env block — set these in .env before building.
  frontend:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
      args:
        DASHBOARD_API_URL: ${DASHBOARD_API_URL:-http://dashboard-api:8001}
        WS_URL: ${WS_URL:-ws://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # ── Worker: default queue ─────────────────────────────────────────────────────
  # Handles: process_call_event, process_voicemail_tier, update_lead_state,
  #          run_nurture_scheduler, send_sms, send_email, collect_metrics.
  # Owns the Postgres scheduler loop — only this role runs it (no duplicate enqueues).
  # Scale: docker compose up --scale worker-default=3
  worker-default:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      WORKER_ROLE: default
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DATABASE:-cora}
      REDIS_HOST: redis
      POSTGRES_POOL_SIZE: "2"
      POSTGRES_MAX_OVERFLOW: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Worker: ai queue ──────────────────────────────────────────────────────────
  # Handles: classify_call_event (3 sequential OpenAI calls per job).
  # Isolated so OpenAI latency never blocks voicemail tier scheduling.
  # Scale: docker compose up --scale worker-ai=3
  worker-ai:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      WORKER_ROLE: ai
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DATABASE:-cora}
      REDIS_HOST: redis
      POSTGRES_POOL_SIZE: "2"
      POSTGRES_MAX_OVERFLOW: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Worker: callbacks queue ───────────────────────────────────────────────────
  # Handles: create_crm_task, send_student_summary, launch_outbound_call.
  # GHL and Synthflow API calls. 2 replicas matches practical GHL rate limits.
  # Scale: docker compose up --scale worker-callbacks=2
  worker-callbacks:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      WORKER_ROLE: callbacks
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DATABASE:-cora}
      REDIS_HOST: redis
      POSTGRES_POOL_SIZE: "2"
      POSTGRES_MAX_OVERFLOW: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Worker: retries queue ─────────────────────────────────────────────────────
  # Handles failed job retries in isolation — retry storms never crowd out
  # live traffic on the default or callbacks queues.
  worker-retries:
    build: .
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      WORKER_ROLE: retries
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DATABASE:-cora}
      REDIS_HOST: redis
      POSTGRES_POOL_SIZE: "2"
      POSTGRES_MAX_OVERFLOW: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Adminer (DB browser + SQL runner, port 8080) ─────────────────────────────
  # Lightweight database UI. Reachable at http://server-ip:8080
  # Login: System=PostgreSQL, Server=postgres, Username/Password/Database from .env
  # WARNING: bind to 127.0.0.1 or put behind auth if server is publicly accessible.
  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    # Named volume — persists across container restarts and image upgrades.
    # Data is stored on the host at /var/lib/docker/volumes/cora-recap-engine_postgres_data
    # Back this up before destructive operations.
